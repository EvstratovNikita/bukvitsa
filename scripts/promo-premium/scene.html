<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Буклица — промо</title>
<style>
  @font-face { font-family: 'M'; src: url(fonts/manrope-cyrillic.woff2) format('woff2'); font-weight: 200 800;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'M'; src: url(fonts/manrope-latin.woff2) format('woff2'); font-weight: 200 800;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'C'; src: url(fonts/cormorant-cyrillic.woff2) format('woff2'); font-weight: 300 700;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'C'; src: url(fonts/cormorant-latin.woff2) format('woff2'); font-weight: 300 700;
    unicode-range: U+0000-00FF, U+2000-206F; }

  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'M', system-ui, sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; left: 0; top: 0; }
  #scene { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; transform-origin: 50% 50%; }

  /* ---------- tiles ---------- */
  .tile { position: absolute; left: 0; top: 0; perspective: 1100px; }
  .tile .in { position: absolute; inset: 0; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; font-weight: 800; }
  .face.back { transform: rotateX(180deg); }
  .empty { background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    box-shadow: inset 0 0 0 3px rgba(190,208,255,.30), 0 14px 34px rgba(2,6,40,.35); }
  .g-gold  { background: linear-gradient(180deg, #ffd766 0%, #f7b21c 50%, #dc860b 100%); }
  .g-green { background: linear-gradient(180deg, #93d655 0%, #5aa82b 50%, #3b771a 100%); }
  .g-dark  { background: linear-gradient(180deg, #62666f 0%, #3c3f47 50%, #23252b 100%); }
  .g-gray  { background: linear-gradient(180deg, #858b9a 0%, #5f6474 50%, #444856 100%); }
  .gloss { box-shadow: inset 0 6px 0 rgba(255,255,255,.36), inset 0 -10px 0 rgba(0,0,0,.20),
    0 22px 40px rgba(3,8,44,.48), 0 4px 10px rgba(3,8,44,.35); }
  .glyph { color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.20), 0 0 2px rgba(0,0,0,.35); line-height: 1; }
  .face:has(.sheen) { overflow: hidden; }
  .sheen { position: absolute; top: -20%; left: 0; width: 55%; height: 140%; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.62) 50%, rgba(255,255,255,0)); transform: translateX(-140%); }

  /* ---------- text ---------- */
  .mask { position: absolute; overflow: hidden; }
  .mask .inner { will-change: transform; }
  .hl { font-size: 98px; font-weight: 800; letter-spacing: -.015em; line-height: 1.12; padding: .04em 0 .12em;
    text-shadow: 0 8px 40px rgba(0,0,30,.45); }
  .gold { background: linear-gradient(180deg, #ffe690 0%, #f9bb2a 55%, #e38f0c 100%); -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: none; filter: drop-shadow(0 6px 24px rgba(60,30,0,.35)); }
  /* padding-left гасит хвостовой letter-spacing последней буквы — иначе строка уезжает влево */
  .tagline { font-size: 34px; font-weight: 800; letter-spacing: .48em; color: rgba(236,242,255,.94); padding: 4px 0 10px .48em;
    text-shadow: 0 4px 22px rgba(0,0,30,.6); }
  .tagline b { color: #f7c948; font-weight: 800; }

  .cap { position: absolute; width: 780px; }
  .cap .mask { position: relative; }
  .over { font-size: 26px; font-weight: 800; letter-spacing: .32em; color: #f7c948; display: flex; align-items: center; gap: 20px; padding: 4px 0 20px; }
  .over i { display: inline-block; width: 64px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #f7c948, rgba(247,201,72,0)); }
  .big { font-size: 100px; font-weight: 800; line-height: 1.02; letter-spacing: -.02em; padding: .02em 0 .1em; text-shadow: 0 10px 44px rgba(0,0,30,.45); }
  .big.gold { text-shadow: none; }
  .sub { font-size: 35px; font-weight: 600; color: rgba(224,233,255,.86); padding-top: 22px; line-height: 1.35; }

  /* ---------- phone ---------- */
  .phone { position: absolute; left: 0; top: 0; width: 518px; height: 896px; perspective: 2600px; }
  .device { position: absolute; inset: 0; border-radius: 80px; transform-style: preserve-3d;
    background: linear-gradient(150deg, #4a5378 0%, #161a31 30%, #080a1a 62%, #313a62 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.10), inset 0 0 0 2px rgba(255,255,255,.16), inset 0 0 22px rgba(0,0,0,.65),
      0 70px 130px rgba(2,5,30,.55), 0 24px 44px rgba(2,5,30,.42); }
  .device .btn1, .device .btn2 { position: absolute; width: 6px; border-radius: 3px; background: linear-gradient(90deg,#1b2038,#4b5578); }
  .device .btn1 { right: -5px; top: 210px; height: 120px; }
  .device .btn2 { left: -5px; top: 180px; height: 70px; }
  .screen { position: absolute; left: 16px; top: 16px; width: 486px; height: 864px; border-radius: 64px; overflow: hidden; background: #0b0e1a; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .glare { position: absolute; left: -60%; top: -20%; width: 220%; height: 140%;
    background: linear-gradient(112deg, transparent 40%, rgba(255,255,255,.18) 47%, rgba(255,255,255,.05) 52%, transparent 58%); }
  .rim { position: absolute; inset: 0; border-radius: 64px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 18px 30px rgba(255,255,255,.05); pointer-events: none; }
  .pshadow { position: absolute; left: 0; top: 0; width: 620px; height: 110px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,20,.55), rgba(0,0,20,0)); }

  .pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 16px 34px 16px 16px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(48,34,8,.92), rgba(22,15,4,.92)); border: 2px solid rgba(247,201,72,.75);
    box-shadow: 0 16px 44px rgba(0,0,0,.45), 0 0 44px rgba(247,201,72,.35); font-size: 40px; font-weight: 800; color: #ffd35a; white-space: nowrap; }
  .pill .coin { width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #fff3b0, #ffcf3f 45%, #b8740a 100%);
    box-shadow: inset 0 0 0 4px rgba(140,80,6,.85), inset 0 0 0 9px rgba(255,236,170,.55); }

  /* ---------- owl / light ---------- */
  .owl { position: absolute; left: 0; top: 0; }
  .owl svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .rays { position: absolute; left: 0; top: 0; width: 1200px; height: 1200px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,226,150,.22) 0deg 5deg, rgba(255,226,150,0) 5deg 15deg);
    -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 30%, transparent 66%); mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 30%, transparent 66%); }
  .halo { position: absolute; left: 0; top: 0; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,216,130,.46) 0%, rgba(130,180,255,.20) 42%, rgba(130,180,255,0) 70%); }

  .cta { position: absolute; left: 0; top: 0; height: 108px; padding: 0 66px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: linear-gradient(180deg, #ffe07a 0%, #f7b51e 55%, #e0900c 100%); color: #2a1a00; font-size: 46px; font-weight: 800; letter-spacing: -.01em;
    box-shadow: inset 0 5px 0 rgba(255,255,255,.45), inset 0 -8px 0 rgba(120,60,0,.25), 0 24px 60px rgba(247,181,30,.35), 0 10px 26px rgba(0,0,0,.35); white-space: nowrap; }
  .cta .shine { position: absolute; top: -20%; left: 0; width: 120px; height: 140%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); }
  .fsub { font-family: 'C', serif; font-style: italic; font-weight: 700; font-size: 70px; color: #fff6e0; letter-spacing: .005em; padding: 0 0 .12em;
    text-shadow: 0 2px 0 rgba(0,0,30,.35), 0 6px 30px rgba(0,0,30,.75); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="scene"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <canvas id="wipe" width="1920" height="1080"></canvas>
</div>
<script src="scene.js"></script>
</body>
</html>
