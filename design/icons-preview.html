<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hootword icons</title>
<style>
  body { margin: 0; font: 600 13px Manrope, system-ui, sans-serif; }
  .sheet { padding: 24px; }
  .dark { background: linear-gradient(160deg, #1b2a6b, #3a2a85); color: #fff; }
  .light { background: #f2f1ec; color: #222; }
  h2 { margin: 0 0 14px; font-size: 14px; opacity: .7; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 18px; }
  .cmp { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; color: #fff;
    background: linear-gradient(160deg, color-mix(in srgb, rgb(var(--mi)) 72%, #fff) 0%, rgb(var(--mi)) 50%, color-mix(in srgb, rgb(var(--mi)) 80%, #000) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.16); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { GameIcon } from '/src/components/icons/GameIcon.jsx';
  import { HomeIcon, SoundOnIcon, PlusIcon } from '/src/components/icons/Icon.jsx';
  const h = React.createElement;
  const ICONS = ['🎯', '🔥', '📅', '🧠', '⏱️', '⚡', '🪙', '🎁', '🦉', '🏆'];
  const sheet = (cls, title) => h('div', { className: `sheet ${cls}` },
    h('h2', null, title),
    h('div', { className: 'row' }, ICONS.map((i) => h(GameIcon, { key: i, icon: i, size: 96 }))),
    h('div', { className: 'row' }, ICONS.map((i) => h(GameIcon, { key: i, icon: i, size: 44 }))),
    h('div', { className: 'row' }, ICONS.map((i) => h(GameIcon, { key: i, icon: i, size: 28 }))),
    h('div', { className: 'row' },
      h('span', null, 'Menu tiles for comparison:'),
      [[HomeIcon, '146 100 255'], [SoundOnIcon, '20 190 160'], [PlusIcon, '255 84 128']].map(([I, mi]) =>
        h('span', { key: mi, className: 'cmp', style: { '--mi': mi } }, h(I))),
      ICONS.slice(0, 3).map((i) => h(GameIcon, { key: i, icon: i, size: 38 }))));
  createRoot(document.getElementById('root')).render(h('div', null, sheet('dark', 'Dark theme'), sheet('light', 'Light theme')));
</script>
</body>
</html>
